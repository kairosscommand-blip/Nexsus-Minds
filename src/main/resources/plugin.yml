name: NexusMinds
version: ${project.version}
main: com.nexuscraft.nexusminds.NexusMindsPlugin
api-version: '1.21'
author: RealSociety
description: Mob AI + speech overhaul. Zombies, skeletons, and pillagers each get a permanent personality that decides how readily they flee, a real grudge memory that outlives vanilla's short-lived aggro, coordinated pack tactics against a shared target, and garbled in-game "speech" tied to their own combat state. Villagers and pillagers speak back when you right-click them, with rich, profession-flavored dialogue. Built on Paper's real Goal/Pathfinder/MobGoals API -- nothing here reimplements pathfinding, and nothing calls out to an external AI service.

commands:
  nexusminds:
    description: Reload NexusMinds' config and dialogue bank.
    usage: /nexusminds reload
    aliases: [minds, nexmind]
    permission: nexusminds.admin

permissions:
  nexusminds.admin:
    description: Reload NexusMinds' config and dialogue bank.
    default: op
